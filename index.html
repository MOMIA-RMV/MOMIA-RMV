<html lang="es">
<head>

<style>
/* VOICE: un coach cercano y directo; claro como una libreta de entrenador.
   IDEA: la libreta de seguimiento del deportista: anillos, rayas, checks verdes.
   PICTURE: el anillo de lo que te queda hoy y el camino a la meta.
   COLOUR and TYPE: tinta casi negra, fondo hueso, acento tomate enérgico, verde solo para lo logrado. Archivo + Inter.
   LAYOUT: app de una columna (máx 560px), barra de pestañas abajo, tarjetas con filas ›. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f2ec,#121413);--card:light-dark(#ffffff,#1c1f1d);--ink:light-dark(#151816,#eef0ec);
--mute:light-dark(#5f665f,#a3aaa3);--line:light-dark(#e3e0d6,#2c312d);--acc:light-dark(#e8461c,#ff6a3d);
--acc-soft:light-dark(#fde3d9,#3a221a);--ok:light-dark(#1f8a4c,#4cc77f);--ok-soft:light-dark(#dff3e6,#183324);
--warn:light-dark(#9a6200,#f0b44a);--deep:light-dark(#151816,#050605)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 0 92px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 10px}
.top small{display:block;color:var(--mute);font-size:13px}
.view{padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mute{color:var(--mute)}.sm{font-size:13px}.b{font-weight:600}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1}
button,.btn{font:600 15px/1 Inter,sans-serif;border:0;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.acc{background:var(--acc);color:#fff}
button.okb{background:var(--ok);color:#fff}
button.link{background:none;color:var(--acc);padding:0 4px;min-height:36px}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 12px;width:100%}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tap{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;color:inherit;width:100%;text-align:left;border-radius:0;font:inherit;min-height:52px}
.tap:first-child{border-top:0}
.tap .chev{margin-left:auto;color:var(--mute);font-size:22px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.done{color:var(--ok);font-weight:600;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:99px}
.bar.okc>i{background:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:600;padding:4px 0;min-height:48px;justify-content:center;border-radius:10px}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--acc)}
@media(min-width:600px){.tabs{max-width:560px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
.ringwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:380px){.ringwrap{grid-template-columns:120px minmax(0,1fr)}}
.ring{position:relative;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font:800 30px Archivo,sans-serif}
.daybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.daybar button{flex:none;min-width:48px;flex-direction:column;gap:2px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:13px}
.daybar button.on{background:var(--ink);color:var(--bg)}
.daybar button small{font-weight:500;font-size:11px;opacity:.7}
.meal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 4px 8px;min-height:50vh}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .act{display:block;color:var(--ok);font-size:13px;font-weight:600;margin-top:6px}
.msg img{max-width:180px;border-radius:10px;display:block;margin-bottom:6px}
.composer{position:sticky;bottom:72px;background:var(--bg);padding:8px 0 10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px;flex:1}
.iconb{width:48px;padding:0;flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.iconb.rec{background:var(--acc);color:#fff;border-color:var(--acc)}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.sugs button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:14px;min-height:38px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--ink);min-height:38px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scale{display:flex;gap:6px}.scale button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:0}
.scale button.on{background:var(--ink);color:var(--bg)}
.fig{position:relative;height:220px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.hero{background:var(--deep);color:#f4f2ec;border-radius:22px;padding:22px 18px;margin:0 0 12px}
.hero .mute{color:#a9b0a9}
.welcome{max-width:460px;margin:0 auto;padding:28px 18px 40px}
.logo{font:800 44px/1 Archivo,sans-serif;letter-spacing:-.02em}
.logo span{color:var(--acc)}
.steps{display:flex;gap:6px;margin:16px 0}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--acc)}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.note{font-size:13px;color:var(--mute);background:var(--bg);border-radius:12px;padding:10px 12px}
.setrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin:4px 0}
.setrow input{min-height:40px;padding:6px 8px;text-align:center}
.setrow .ck{width:44px;min-height:40px;padding:0;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.setrow .ck.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .6s ease}.bar>i{transition:width .5s ease}}
</style>
</head>

const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};

const wd=k=>(parseD(k).getDay()+6)%7; // 0=lunes

const fmt=n=>Math.round(n).toLocaleString('es-CL');
const clp=n=>'$'+Math.round(n).toLocaleString('es-CL');
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

const MEALS=[['desayuno','Desayuno',.25],['almuerzo','Almuerzo',.35],['colacion','Colación',.10],['cena','Cena',.30]];

const fdate=k=>{const d=parseD(k);return DAYS[wd(k)].toLowerCase()+' '+d.getDate()+'/'+(d.getMonth()+1)};
let toastT;
function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.append(e)}e.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2600)}

const CAT={};for(const[k,a]of Object.entries(CAT_RAW))CAT[k]={k,name:a[0],kcal:a[1],prot:a[2],al:a[3].split('|'),unit:a[4],place:a[5]||null,fmt:a[6],pack:a[7],price:a[8],raw:a[9]??1,liq:a[10]||null};
const ALIAS=Object.values(CAT).flatMap(c=>c.al.map(a=>[a,c])).sort((x,y)=>y[0].length-x[0].length);
const normal=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function findCat(text){const t=' '+normal(text)+' ';for(const[a,c]of ALIAS){const n=normal(a);if(new RegExp('[^a-z]'+n.replace(/ /g,'\\s+')+'[^a-z]').test(t))return c}return null}
const NUMW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,medio:.5,media:.5,'1/2':.5};
function parseFood(text){
 const parts=normal(text).replace(/^(hoy |ayer )?(desayune|almorce|cene|comi|tome|me tome|me comi|meriende|picotee|me servi)\s+/,'').split(/,| con | y | mas |\+|;/).map(s=>s.trim()).filter(Boolean);
 const items=[],unknown=[];
 for(const p of parts){
  const c=findCat(p);if(!c){if(p.length>2&&!/^(un|una|de|el|la)$/.test(p))unknown.push(p);continue}
  let g=c.unit,m;
  if(m=p.match(/(\d+[.,]?\d*)\s*(g|gr|gramos|ml|cc)\b/))g=parseFloat(m[1].replace(',','.'));
  else{let q=1;if(m=p.match(/(\d+[.,]?\d*)/))q=parseFloat(m[1].replace(',','.'));else for(const w in NUMW)if(new RegExp('(^|\\s)'+w.replace('/','\\/')+'(\\s|$)').test(p)){q=NUMW[w];break}
   let mult=1;if(/plato/.test(p))mult=1.5;if(/taza/.test(p))mult=1.2;if(/cucharad/.test(p))mult=c.unit>=15?.5:1;if(/vaso/.test(p)&&c.liq)mult=1;
   g=c.unit*q*mult}
  items.push({cat:c,g:Math.round(g)})}
 return{items,unknown}}
const nutr=(c,g)=>({kcal:Math.round(c.kcal*g/100),prot:Math.round(c.prot*g/10)/10});

const today=()=>dkey();
function age(){const p=S.profile;const b=parseD(p.birth),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function curW(){const w=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);return w.length?w[w.length-1].kg:S.profile.weight}
function bmr(){const p=S.profile;return 10*curW()+6.25*p.height-5*age()+(p.sex==='m'?5:-161)}
function trainAvg(){const from=addDays(today(),-13);let k=S.train.cardio.filter(c=>c.date>=from).reduce((s,c)=>s+c.kcal,0);k+=S.train.sessions.filter(s=>s.date>=from).reduce((s,x)=>s+Math.round(4.5*curW()*(x.min||45)/60),0);return k/14}
function tdee(){return bmr()*S.profile.activity}
function baseKcal(){const p=S.profile,t=tdee();let k=t;if(p.goal==='lose')k=t-Math.min(p.pace*1100,.25*t);else if(p.goal==='gain')k=t+p.pace*1100;return Math.round(Math.max(k,p.sex==='m'?1500:1200)/10)*10}
function protT(){const g=S.profile.goal;return Math.round(curW()*(g==='lose'?2:g==='gain'?1.8:1.6))}
function adjFor(date){const a=S.adjust[weekStart(date)];return a&&date>=a.from?a.perDay:0}
function kcalT(date=today()){return baseKcal()+adjFor(date)+actBonus(date)}
/* calorías activas de Salud: lo normal ya está en el factor de actividad; se suma el 50% de lo que pase de lo normal (los relojes sobreestiman) */
function actBase(){const p=S.profile;return Math.round(Math.max(200,(p.activity-1.1)*bmr())/10)*10}
function actKcal(date){const h=(S.health||{})[date];return h&&h.kcal!=null?h.kcal:null}
function actBonus(date){const k=actKcal(date);if(k==null||!S.profile)return 0;return Math.min(600,Math.max(0,Math.round((k-actBase())*.5/10)*10))}
function balance(date=today()){const k=actKcal(date);if(k==null)return null;const n=new Date(),fr=date===today()?Math.min(1,(n.getHours()+n.getMinutes()/60)/24):1,rest=Math.round(bmr()*fr);const ate=sum(dayLogs(date),l=>l.kcal),burn=rest+Math.round(k);return{ate,burn,rest,act:k,bal:ate-burn,bonus:actBonus(date),base:actBase()}}
function metaParts(t=today()){const a=adjFor(t),b=actBonus(t),base=baseKcal();const p=[`base ${fmt(base)}`];if(a)p.push(`${a>0?'+':'−'} ${fmt(Math.abs(a))} ajuste semanal`);if(b)p.push(`+ ${fmt(b)} por actividad`);return{base,a,b,txt:p.join(' ')}}
function metaTxt(t){const m=metaParts(t),h=actKcal(t)!=null;if(!m.a&&!m.b)return h?`<div class="sm mute">Meta de hoy: ${fmt(kcalT(t))} kcal, sin ajuste (tu actividad está dentro de lo normal)</div>`:'';return`<div class="sm" style="margin-top:2px"><b>Meta ajustada de hoy: ${fmt(kcalT(t))} kcal</b></div><div class="sm mute">${m.txt}</div>`}
function balHtml(){const b=balance();if(!b)return'';const g=S.profile.goal,d=-b.bal;
 const msg=g==='lose'?(d>=0?`Vas con ${fmt(d)} kcal de déficit: bien para bajar grasa.`:`Vas ${fmt(-d)} kcal sobre lo que gastaste.`):g==='gain'?(d<=0?`Vas ${fmt(-d)} kcal sobre lo que gastaste: bien para ganar músculo.`:`Te faltan ${fmt(d)} kcal para cubrir lo que gastaste.`):(Math.abs(d)<250?'Vas parejo con lo que gastaste.':d>0?`Vas ${fmt(d)} kcal bajo lo que gastaste.`:`Vas ${fmt(-d)} kcal sobre lo que gastaste.`);
 return`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="sm mute">Balance de hoy (Salud)</div><div class="b num">Comiste ${fmt(b.ate)} · gastaste ${fmt(b.burn)} kcal</div><div class="sm mute">${fmt(b.rest)} en reposo hasta ahora + ${fmt(b.act)} activas. ${msg}</div></div>`}
function actWeeks(n=4){const out=[];let ws=weekStart(today());for(let i=0;i<n;i++){const days=[];for(let d=ws,j=0;j<7;j++,d=addDays(d,1)){const k=actKcal(d);if(k!=null)days.push(k)}
 const w=S.weights.filter(x=>x.date>=ws&&x.date<addDays(ws,7));out.push({ws,kcal:days.length?Math.round(sum(days,x=>x)/days.length):null,n:days.length,kg:w.length?Math.round(sum(w,x=>x.kg)/w.length*10)/10:null});ws=addDays(ws,-7)}return out}

function waterGoal(){return S.waterCustom||Math.round((35*curW()+500*trainHoursToday())/50)*50}
const waterToday=()=>sum(S.water.filter(w=>w.date===today()&&w.type!=='alcohol'),w=>w.ml);
function nextGlass(){const left=waterGoal()-waterToday();if(left<=0)return null;const n=new Date(),end=new Date();end.setHours(22,0,0,0);const glasses=Math.ceil(left/250);const mins=Math.max(0,(end-n)/60000);
 const last=S.water.filter(w=>w.date===today()).map(w=>w.time).sort().pop();const interval=glasses?mins/glasses:0;
 let due=0;if(last){const[h,m]=last.split(':').map(Number);const lt=new Date();lt.setHours(h,m,0,0);due=Math.max(0,Math.round((lt.getTime()+interval*60000-n.getTime())/60000))}
 return{left,glasses,due,late:mins<=0}}
function goalInfo(){const p=S.profile,start=p.startWeight,cur=curW(),goal=p.goalWeight;
 const total=Math.abs(start-goal)||1,doneKg=p.goal==='gain'?cur-start:start-cur;const pct=Math.max(0,Math.min(100,doneKg/total*100));
 const exp=Math.round(tdee()+trainAvg()),plan=baseKcal(),def=exp-plan;const kgw=Math.abs(def)*7/7700;const left=Math.abs(cur-goal);
 const dirOk=(p.goal==='lose'&&def>0&&cur>goal)||(p.goal==='gain'&&def<0&&cur<goal);
 const weeks=dirOk&&kgw>0?left/kgw:null;let eta=null;if(weeks!=null){eta=addDays(today(),Math.round(weeks*7))}
 return{start,cur,goal,pct,doneKg,left,exp,plan,def,kgw,weeks,eta,b:Math.round(bmr()),tr:Math.round(trainAvg())}}

function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function okRec(k){const dis=S.menu.dislikes.map(normal);return!dis.some(d=>Object.keys(R[k][2]).some(i=>CAT[i].al.some(a=>normal(a).includes(d)||d.includes(normal(a))))||normal(R[k][0]).includes(d))}
function weekMenu(){const r=rng(S.menu.seed*7919+parseD(weekStart(today())).getTime()/864e5);
 const pick=(p,n)=>{let l=Object.keys(R).filter(k=>k.startsWith(p)&&okRec(k));if(!l.length)l=Object.keys(R).filter(k=>k.startsWith(p));l=shuffle(l,r);while(l.length<n)l=l.concat(l);return l.slice(0,n)};
 const d=pick('d',3),a=pick('a',4),c=pick('c',3),n=pick('n',4);const out=[];
 const L=[a[0],a[1],a[0],a[2],a[3],a[2],a[3]],N=[n[0],n[1],n[0],n[2],n[3],n[2],n[3]];
 for(let i=0;i<7;i++)out.push({desayuno:d[i%3],almuerzo:L[i],colacion:c[i%3],cena:N[i]});return out}
function scaleFor(rec,date){const m=MEALS.find(x=>x[0]===R[rec][1]);return Math.max(.6,Math.min(1.9,kcalT(date)*m[2]/recKcal(rec)))}
function recPortion(rec,date){const s=scaleFor(rec,date);return Object.entries(R[rec][2]).map(([k,g])=>({k,g:Math.round(g*s/5)*5||5}))}
function portionTot(p){return{kcal:Math.round(sum(p,i=>CAT[i.k].kcal*i.g/100)),prot:Math.round(sum(p,i=>CAT[i.k].prot*i.g/100))}}

function frequent(){const groups={};for(const l of S.logs){if(l.cheat)continue;const k=l.date+'|'+l.meal+'|'+(l.time||'');(groups[k]=groups[k]||[]).push(l)}
 const combos={};for(const[k,ls]of Object.entries(groups)){const date=k.split('|')[0],meal=k.split('|')[1];const key=ls.map(l=>normal(baseName(l.name))).sort().join(' + ');

 return Object.values(combos).map(c=>({...c,n:c.dates.size,meal:Object.entries(c.meals).sort((a,b)=>b[1]-a[1])[0][0],kcal:sum(c.items,i=>i.kcal),prot:Math.round(sum(c.items,i=>i.prot))})).filter(c=>c.n>=2).sort((a,b)=>b.n-a.n)}
function suggestFor(meal){const left=kcalT()-eaten().kcal;const f=frequent();const mine=S.myMeals.filter(m=>m.meal===meal).map(m=>({label:m.name,kcal:m.kcal,prot:m.prot,my:m.id,n:0}));

function battery(){const t=today(),ci=S.checkins[t],now=new Date(),h=Math.max(0,now.getHours()+now.getMinutes()/60-7);const parts=[];
 const hs=(S.health||{})[t],hsl=hs&&hs.sueno;const sl=ci?Math.min(1,ci.sleep/8):hsl?Math.min(1,hsl/8):.75,en=ci?ci.energy/5:.6;let v=100*(.5*sl+.5*en);parts.push([ci?`Base: sueño ${ci.sleep} h y energía ${ci.energy}/5`:hsl?`Base: sueño ${hrsTxt(hsl)} h (Salud), sin check-in`:'Base: sin check-in (valor medio)',Math.round(v)]);
 if(ci&&ci.pain){const p=[0,8,20][ci.pain];v-=p;parts.push(['Dolor '+['','leve','fuerte'][ci.pain],-p])}
 const dr=Math.round(h*3);v-=dr;parts.push([WAKE,-dr]);
 const meals=new Set(dayLogs(t).map(l=>l.meal)).size,fb=Math.min(12,meals*4);if(fb){v+=fb;parts.push(['Comidas registradas',fb])}
 const exp=Math.max(0,Math.min(1,(h-1)/13)),ef=eaten().kcal/kcalT();if(ef<exp-.2){const p=Math.round(Math.min(15,(exp-ef)*30));v-=p;parts.push(['Vas atrasado con la comida',-p])}
 const wexp=Math.max(0,Math.min(1,h/15)),wf=waterToday()/waterGoal();if(wf<wexp-.2){const p=Math.round(Math.min(10,(wexp-wf)*20));v-=p;parts.push(['Te falta agua',-p])}
 const tr=S.train.sessions.filter(s=>s.date===t).length*8+Math.min(12,Math.round(sum(S.train.cardio.filter(c=>c.date===t),c=>c.min)*.15));if(tr){v-=tr;parts.push(['Entrenamiento de hoy',-tr])}
 const pct=Math.round(Math.max(3,Math.min(100,v)));const hl=Math.max(0,23-now.getHours()-now.getMinutes()/60);const hrs=Math.min(hl,pct/100*16);
 const worst=parts.filter(p=>p[1]<0&&p[0]!==WAKE).sort((a,b)=>a[1]-b[1])[0];

let pendingH=null;
function healthFrom(q){const num=k=>{let v=q.get(k);if(v==null)return null;v=String(v).replace(/[^0-9.,]/g,'');if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,'');else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)&&!/^\d{1,3},\d{3}$/.test(v))v=v.replace(/,/g,'');v=v.replace(',','.');const n=parseFloat(v);return isFinite(n)?n:null};
 const h={};let x=num('pasos');if(x!=null&&x>=0&&x<200000)h.pasos=Math.round(x);
 x=(()=>{const r=String(q.get('sueno')||q.get('sueño')||'').toLowerCase();let m=r.match(/(\d+)\s*:\s*(\d+)/);if(m)return +m[1]+m[2]/60;m=r.match(/(\d+(?:[.,]\d+)?)\s*h/);if(m){const mm=r.match(/(\d+)\s*m/);return parseFloat(m[1].replace(',','.'))+(mm?mm[1]/60:0)}m=r.match(/^\s*(\d+)\s*min/);if(m)return m[1]/60;return null})();if(x==null)x=num('sueno');if(x==null)x=num('sueño');if(x!=null&&x>0){if(x>1440)x=x/3600;else if(x>24)x=x/60;if(x<=24)h.sueno=Math.round(x*10)/10}
 x=num('fc');if(x!=null&&x>=25&&x<=220)h.fc=Math.round(x);
 x=num('peso');if(x!=null&&x>=25&&x<=350)h.peso=Math.round(x*10)/10;
 x=num('kcal');if(x!=null&&x>=0&&x<=15000)h.kcal=Math.round(x);return h}

 if(['pasos','sueno','sueño','fc','peso','kcal'].some(k=>q.has(k))){const rest=[...q.entries()].filter(([k])=>!['pasos','sueno','sueño','fc','peso','kcal'].includes(k));

 const pts=[{date:p.startDate,kg:p.startWeight},...S.weights].sort((a,b)=>a.date<b.date?-1:1);
 const d0=parseD(p.startDate).getTime();const endD=g.eta?parseD(g.eta).getTime():parseD(addDays(today(),56)).getTime();const lastD=Math.max(endD,parseD(today()).getTime()+864e5*7);
 const kgs=pts.map(x=>x.kg).concat([p.goalWeight]);const lo=Math.min(...kgs)-1,hi=Math.max(...kgs)+1;
 const X=t=>36+(t-d0)/(lastD-d0||1)*(W-48),Y=k=>10+(hi-k)/(hi-lo)*(H-34);
 const plan=g.kgw?`<line x1="${X(d0)}" y1="${Y(p.startWeight)}" x2="${X(lastD)}" y2="${Y(g.eta?p.goalWeight:p.startWeight+(p.goal==='gain'?1:-1)*g.kgw*((lastD-d0)/6048e5))}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 5"/>`:'';
 const path=pts.map((x,i)=>(i?'L':'M')+X(parseD(x.date).getTime()).toFixed(1)+' '+Y(x.kg).toFixed(1)).join('');
 const ticks=[hi-1,(hi+lo)/2,lo+1].map(k=>`<text x="2" y="${Y(k)+4}" font-size="11" fill="var(--mute)">${k.toFixed(0)}</text><line x1="34" x2="${W}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/>`).join('');
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${ticks}<line x1="34" x2="${W}" y1="${Y(p.goalWeight)}" y2="${Y(p.goalWeight)}" stroke="var(--ok)" stroke-opacity=".35"/>${plan}<path d="${path}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round"/>${pts.map(x=>`<circle cx="${X(parseD(x.date).getTime())}" cy="${Y(x.kg)}" r="4" fill="var(--ok)"/>`).join('')}<text x="${W-4}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--mute)">${g.eta?'meta '+parseD(g.eta).getDate()+'/'+(parseD(g.eta).getMonth()+1):''}</text><text x="36" y="${H-4}" font-size="11" fill="var(--mute)">${parseD(p.startDate).getDate()}/${parseD(p.startDate).getMonth()+1}</text></svg>`};
 if(chartRO)chartRO.disconnect();chartRO=new ResizeObserver(draw);chartRO.observe(el);draw()}

async function tfetch(u,o,ms=30000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{return await fetch(u,{...o,signal:ac.signal})}catch(e){throw{code:ac.signal.aborted?'timeout':'net'}}finally{clearTimeout(t)}}
async function gemCall(body,tried){const m=apiModel();const r=await tfetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':LS('become.gkey')},body:JSON.stringify(body)});
 if(r.status===404){tried=tried||[m];const alt=['gemini-flash-lite-latest','gemini-flash-latest','gemini-3.5-flash-lite','gemini-3.6-flash'].find(x=>!tried.includes(x));if(alt){LS('become.gmodel',alt);return gemCall(body,tried.concat(alt))}}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:'http',status:r.status===400&&/API key/i.test((j.error&&j.error.message)||'')?401:r.status,message:(j.error&&j.error.message)||r.statusText};return j}
async function gemCoach(hist,acts,img,onText){const tools=coachTools(acts);
 const decl=tools.map(t=>{const d={name:t.name,description:t.description};if(Object.keys(t.inputSchema.properties||{}).length)d.parameters=t.inputSchema;return d});
 const contents=hist.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
 if(img){const d=await shrink(img,1200,.8);contents[contents.length-1].parts.unshift({inlineData:{mimeType:'image/jpeg',data:d.split(',')[1]}})}
 let text='';for(let i=0;i<8;i++){const j=await gemCall({systemInstruction:{parts:[{text:ctxText()}]},contents,tools:[{functionDeclarations:decl}]});
  const cand=(j.candidates||[])[0];if(!cand||!cand.content){if(j.promptFeedback&&j.promptFeedback.blockReason)return 'No puedo ayudarte con eso.';return text||'No recibí respuesta de Gemini.'}
  const parts=cand.content.parts||[];const t=parts.filter(x=>x.text&&!x.thought).map(x=>x.text).join('\n').trim();if(t){text=t;onText&&onText(t)}
  const calls=parts.filter(x=>x.functionCall);if(!calls.length)return text;
  contents.push({role:'model',parts});
  const res=await Promise.all(calls.map(async c=>{const fc=c.functionCall,tool=tools.find(x=>x.name===fc.name);let out;try{out=tool?await tool.execute(fc.args||{}):{error:'herramienta desconocida'}}catch(e){out={error:String(e)}}
   const fr={name:fc.name,response:(out&&typeof out==='object'&&!Array.isArray(out))?out:{resultado:out}};if(fc.id)fr.id=fc.id;return{functionResponse:fr}}));
  contents.push({role:'user',parts:res})}
 return text||'Listo.'}

 const msgs=hist.map(m=>({role:m.role,content:m.content}));
 if(img){const d=await shrink(img,1200,.8);msgs[msgs.length-1].content=[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}},{type:'text',text:msgs[msgs.length-1].content}]}

function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=u})}

 if(!cur&&all['become.cur']){try{for(const[k,v]of Object.entries(all))if(typeof v==='string'&&localStorage.getItem(k)==null)localStorage.setItem(k,v)}catch(e){}
  const c=all['become.cur'];const raw=all[LKEY+c];if(raw){try{S=Object.assign(DEF(),JSON.parse(raw));account=c;tab='hoy';route();toast('Datos recuperados')}catch(e){}}}
 else if(cur&&all[LKEY+cur]){try{const o=JSON.parse(all[LKEY+cur]);if((o.upd||0)>(S.upd||0)){S=Object.assign(DEF(),o);render()}}catch(e){}}
 else mirror()})();
